<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ページが見つかりません｜bard vision</title>
<link rel="icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    color: #fff;
    background: radial-gradient(120% 120% at 75% 20%, #24304a 0%, #1a2130 55%, #141a26 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 40px 20px; text-align: center;
}
.box { max-width: 560px; }
.logo { width: 220px; margin: 0 auto 48px; display: block; }
.code { font-size: 72px; font-weight: 700; letter-spacing: .08em; line-height: 1; margin: 0; color: #2ca6e0; }
h1 span { display: inline-block; }
h1 { font-size: 22px; font-weight: 700; letter-spacing: .06em; margin: 20px 0 16px; }
p { font-size: 15px; line-height: 1.9; color: #b9c6d8; margin: 0; }
.btn {
    display: inline-block; margin-top: 40px; padding: 16px 48px; border-radius: 4px;
    background: #2ca6e0; color: #fff; text-decoration: none; letter-spacing: .08em;
    transition: opacity .2s;
}
.btn:hover { opacity: .8; }
@media (max-width: 600px) {
    .logo { width: 180px; margin-bottom: 36px; }
    .code { font-size: 56px; }
    h1 { font-size: 19px; }
    p { font-size: 14px; }
    .btn { display: block; padding: 16px 0; }
}
</style>
</head>
<body>
<div class="box">
    <a href="/"><img class="logo" src="/images/logo.svg" alt="bard vision"></a>
    <p class="code">404</p>
    <h1><span>お探しのページは</span><span>見つかりませんでした</span></h1>
    <p>ホームページをリニューアルしたため、ページの場所が変わったか、削除された可能性があります。お手数ですが、トップページからお探しください。</p>
    <a class="btn" href="/">トップページへ戻る</a>
</div>
</body>
</html>
